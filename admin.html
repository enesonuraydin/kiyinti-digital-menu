<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIYINTI Menü Editörü</title><link rel="stylesheet" href="style.css"><style>main{max-width:850px;margin:auto;padding:20px}label{display:block;margin:12px 0}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font:inherit}button{padding:12px;margin:6px 0;cursor:pointer}textarea{min-height:90px}</style><main><h1>Menü editörü</h1><p>Yerel taslak düzenleyici. Değişiklikler yalnızca bu tarayıcıda saklanır. Yayınlamak için menu.js dosyasını indirip GitHub'a yükleyin.</p><label>Kategori<select id="cat"></select></label><label>Ürün<select id="prod"></select></label><label>Ürün adı<input id="name"></label><label>İçerik<textarea id="desc"></textarea></label><div id="prices"></div><label><input style="width:auto;display:inline" type="checkbox" id="hidden"> Menüde gizle</label><button id="save">Taslağı kaydet</button> <button id="add">Yeni ürün</button> <button id="export">menu.js indir</button><p id="status" role="status"></p></main><script src="menu.js"></script><script src="admin.js"></script></html>
